<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Nexus AI - Research Professional</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --main-white: #ffffff;
            --accent-blue: #2563eb;
            --light-blue: #eff6ff;
            --text-dark: #0f172a;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --status-online: #22c55e;
            --status-offline: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-dark); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header */
        header {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--main-white);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            z-index: 100;
        }

        .btn-new { background: var(--accent-blue); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.3s; }
        .btn-new:hover { background: #1d4ed8; }

        .menu-btn { cursor: pointer; padding: 10px 15px; border-radius: 8px; color: var(--accent-blue); background: var(--light-blue); font-weight: 700; border: none; }

        #main-wrapper { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar */
        #network-sidebar {
            width: 260px;
            background: var(--main-white);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header { padding: 20px; font-weight: 700; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; color: var(--accent-blue); }
        #agent-list { flex: 1; overflow-y: auto; padding: 12px; }
        .agent-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; margin-bottom: 5px; font-size: 0.85rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .online { background: var(--status-online); box-shadow: 0 0 5px var(--status-online); }
        .offline { background: var(--status-offline); }

        /* Chat Area */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 10%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message { max-width: 80%; padding: 16px 20px; border-radius: 20px; line-height: 1.6; font-size: 0.95rem; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }
        
        .user-message { align-self: flex-end; background: var(--accent-blue); color: white; border-bottom-right-radius: 4px; }
        .ai-message { align-self: flex-start; background: var(--main-white); border: 1px solid var(--border-color); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
        .system-msg { align-self: center; font-size: 0.75rem; background: #e2e8f0; padding: 5px 12px; border-radius: 12px; font-weight: 600; }

        /* Modal Settings */
        #settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center; align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white; width: 90%; max-width: 500px; padding: 25px; border-radius: 20px;
            max-height: 85vh; overflow-y: auto;
        }

        .field-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; color: var(--text-dark); }
        .premium-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 0.85rem; outline: none; }
        .premium-input:focus { border-color: var(--accent-blue); }

        .api-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .api-row { display: flex; gap: 8px; }
        .remove-btn { color: #ef4444; border: none; background: none; cursor: pointer; font-weight: bold; }

        /* Toggle Button Styles */
        .toggle-container { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid #eee; margin-top: 10px; }
        .switch { position: relative; display: inline-block; width: 45px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-blue); }
        input:checked + .slider:before { transform: translateX(21px); }

        /* Input Card */
        #input-area { padding: 20px 10%; background: var(--bg-color); border-top: 1px solid var(--border-color); }
        .input-card { background: white; border-radius: 20px; padding: 12px 20px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; box-shadow: var(--shadow); }
        #chat-input { flex: 1; border: none; outline: none; font-size: 1rem; resize: none; min-height: 25px; }

        .premium-send {
            background: var(--accent-blue); color: white; border: none; padding: 12px 25px; border-radius: 12px;
            font-weight: 700; cursor: pointer; transition: 0.3s; white-space: nowrap;
        }
        .premium-send:hover { background: #1d4ed8; transform: translateY(-2px); }

        /* Progress Bar */
        .progress-box { display: none; margin-bottom: 10px; }
        .bar-container { height: 4px; background: #eee; border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0; background: var(--accent-blue); transition: 0.3s; }

        @media (max-width: 768px) { #network-sidebar { display: none; } #chat-container, #input-area { padding: 15px; } }
    </style>
</head>
<body>

    <header>
        <div class="logo-area"><button class="btn-new" onclick="createNewChat()">New Research</button></div>
        <div id="active-agent-display" style="font-weight: 700; color: var(--accent-blue);">Nexus Agent</div>
        <button class="menu-btn" onclick="toggleModal(true)">Settings</button>
    </header>

    <div id="main-wrapper">
        <aside id="network-sidebar">
            <div class="sidebar-header">🌐 Network Agents</div>
            <div id="agent-list"></div>
        </aside>

        <main id="chat-container">
            <div class="message ai-message">স্বাগতম! আপনার ব্লু নেক্সাস রিসার্চ টুল এখন প্রস্তুত। শুরু করতে প্রশ্ন লিখুন।</div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px; border-bottom: 2px solid var(--light-blue); padding-bottom: 10px;">Settings Configuration</h3>
            
            <div class="field-group">
                <label>Agent Name</label>
                <input type="text" id="agent-name-input" class="premium-input" placeholder="Nexus Pro">
            </div>

            <div class="field-group">
                <label>Groq API Keys (Multiple)</label>
                <div id="api-key-boxes" class="api-list">
                    <!-- Multiple API boxes will be injected here -->
                </div>
                <button onclick="addApiField()" style="background: var(--light-blue); color: var(--accent-blue); border: none; width: 100%; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer;">+ Add Key Box</button>
            </div>

            <div class="field-group">
                <label>Tavily Search API Key (Optional)</label>
                <input type="password" id="tavily-key-input" class="premium-input" placeholder="tvly-...">
            </div>

            <div class="field-group">
                <label>Serper Google Search API Key (Optional)</label>
                <input type="password" id="serper-key-input" class="premium-input" placeholder="Serper key...">
            </div>

            <div class="toggle-container">
                <div style="font-weight: 700; font-size: 0.9rem;">Web Search Integration</div>
                <label class="switch">
                    <input type="checkbox" id="web-search-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="saveSettings()" style="flex:1; padding: 12px; background: var(--accent-blue); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer;">Save Permanently</button>
                <button onclick="toggleModal(false)" style="padding: 12px; background: #eee; border: none; border-radius: 10px; cursor: pointer;">Close</button>
            </div>
        </div>
    </div>

    <div id="input-area">
        <div class="progress-box" id="p-box">
            <div class="bar-container"><div class="bar-fill" id="p-fill"></div></div>
            <div style="font-size: 0.65rem; color: var(--accent-blue); margin-top: 4px; font-weight: bold;" id="p-text">Agent Researching...</div>
        </div>

        <div class="input-card">
            <textarea id="chat-input" placeholder="মেসেজ লিখুন..." rows="1" oninput="this.style.height='';this.style.height=this.scrollHeight+'px'"></textarea>
            <button class="premium-send" onclick="sendMessage()">Send Message</button>
        </div>
    </div>

    <script>
        // --- Firebase Initialize ---
        const firebaseConfig = {
            databaseURL: "https://ar-ai-195a9-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let chatHistory = [];
        let currentKeyIdx = 0;
        let myAgentName = "Agent-" + Math.floor(Math.random() * 1000);

        // --- Permanent Data Persistence ---
        function loadSettingsFromStorage() {
            // Load Agent Name
            const storedName = localStorage.getItem('nexus_agent_name');
            if (storedName) {
                myAgentName = storedName;
                document.getElementById('agent-name-input').value = myAgentName;
                document.getElementById('active-agent-display').innerText = myAgentName;
            }

            // Load Other Keys
            document.getElementById('tavily-key-input').value = localStorage.getItem('nexus_tavily_key') || '';
            document.getElementById('serper-key-input').value = localStorage.getItem('nexus_serper_key') || '';
            
            // Load Web Search Toggle
            const isWebEnabled = localStorage.getItem('nexus_web_search_enabled') === 'true';
            document.getElementById('web-search-toggle').checked = isWebEnabled;

            // Load Multiple Groq Keys
            const savedGroqKeys = JSON.parse(localStorage.getItem('nexus_groq_keys') || '[]');
            const container = document.getElementById('api-key-boxes');
            container.innerHTML = '';
            if (savedGroqKeys.length === 0) {
                addApiField('');
            } else {
                savedGroqKeys.forEach(k => addApiField(k));
            }
        }

        function saveSettings() {
            const nameInput = document.getElementById('agent-name-input').value.trim();
            const groqInputs = document.querySelectorAll('.groq-key-val');
            const tavilyVal = document.getElementById('tavily-key-input').value.trim();
            const serperVal = document.getElementById('serper-key-input').value.trim();
            const webToggle = document.getElementById('web-search-toggle').checked;

            const groqKeysArray = Array.from(groqInputs).map(i => i.value.trim()).filter(k => k !== "");

            // Save to localStorage
            localStorage.setItem('nexus_agent_name', nameInput || myAgentName);
            localStorage.setItem('nexus_groq_keys', JSON.stringify(groqKeysArray));
            localStorage.setItem('nexus_tavily_key', tavilyVal);
            localStorage.setItem('nexus_serper_key', serperVal);
            localStorage.setItem('nexus_web_search_enabled', webToggle);

            if(nameInput) {
                myAgentName = nameInput;
                document.getElementById('active-agent-display').innerText = myAgentName;
            }
            
            alert("Settings saved permanently!");
            updateFirebaseStatus();
            toggleModal(false);
        }

        function addApiField(val = '') {
            const container = document.getElementById('api-key-boxes');
            const row = document.createElement('div');
            row.className = 'api-row';
            row.innerHTML = `
                <input type="password" class="premium-input groq-key-val" value="${val}" placeholder="gsk_xxxx...">
                <button class="remove-btn" onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(row);
        }

        // --- Network & Messaging ---
        function updateFirebaseStatus() {
            db.ref('agents/' + myAgentName).set({ name: myAgentName, lastSeen: Date.now() });
            db.ref('agents/' + myAgentName).onDisconnect().remove();
        }

        async function fetchNetworkAgents() {
            const snap = await db.ref('agents').once('value');
            const listEl = document.getElementById('agent-list');
            listEl.innerHTML = '';
            const data = snap.val();
            const now = Date.now();
            if(data) {
                Object.values(data).forEach(agent => {
                    const isOnline = (now - agent.lastSeen) < 60000;
                    const item = document.createElement('div');
                    item.className = 'agent-item';
                    item.innerHTML = `<div class="status-dot ${isOnline ? 'online' : 'offline'}"></div><span>${agent.name}</span>`;
                    listEl.appendChild(item);
                });
            }
        }

        // --- Core Message Handler ---
        function toggleModal(show) { document.getElementById('settings-modal').style.display = show ? 'flex' : 'none'; }
        
        function createNewChat() {
            chatHistory = [];
            document.getElementById('chat-container').innerHTML = '<div class="message system-msg">Started a clean new session.</div>';
        }

        function addMessageToUI(txt, type) {
            const chatBox = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `message ${type}-message`;
            div.innerText = txt;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const query = input.value.trim();
            const savedKeys = JSON.parse(localStorage.getItem('nexus_groq_keys') || '[]');
            const searchEnabled = localStorage.getItem('nexus_web_search_enabled') === 'true';

            if(!query) return;
            if(savedKeys.length === 0) { alert("Add a Groq API key first!"); toggleModal(true); return; }

            addMessageToUI(query, 'user');
            input.value = '';
            input.style.height = 'auto';

            document.getElementById('p-box').style.display = 'block';
            document.getElementById('p-fill').style.width = '50%';
            
            try {
                let systemPrompt = "You are Blue Nexus, a highly efficient AI Research Agent. Help user clearly.";
                if(searchEnabled) systemPrompt += " [Web Search Mode Enabled]: Act as you have browsed latest news to answer this.";

                const response = await callGroqWithFallback(query, systemPrompt, savedKeys);
                addMessageToUI(response, 'ai');
            } catch (err) {
                addMessageToUI("Error: All API Keys exhausted or Invalid Key.", 'ai');
            } finally {
                document.getElementById('p-fill').style.width = '100%';
                setTimeout(() => document.getElementById('p-box').style.display = 'none', 1000);
            }
        }

        async function callGroqWithFallback(prompt, system, keys) {
            for (let i = currentKeyIdx; i < keys.length; i++) {
                try {
                    const currentKey = keys[i];
                    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${currentKey}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile",
                            messages: [
                                {role: "system", content: system},
                                ...chatHistory,
                                {role: "user", content: prompt}
                            ]
                        })
                    });

                    if (res.ok) {
                        currentKeyIdx = i; // Store success index
                        const data = await res.json();
                        const resultText = data.choices[0].message.content;
                        chatHistory.push({role: "user", content: prompt}, {role: "assistant", content: resultText});
                        return resultText;
                    } else if (res.status === 429) {
                        console.warn(`Key box ${i+1} limited. Trying next box...`);
                    }
                } catch (e) {
                    console.error("Error with API box:", i, e);
                }
            }
            currentKeyIdx = 0; // reset
            throw new Error("API Failure");
        }

        // Init Lifecycle
        window.onload = () => {
            loadSettingsFromStorage();
            updateFirebaseStatus();
            setInterval(updateFirebaseStatus, 25000);
            setInterval(fetchNetworkAgents, 10000);
            fetchNetworkAgents();
        };

        // Listen for Enter key
        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
    </script>
</body>
</html>
